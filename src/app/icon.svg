<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="256" height="256" rx="58" fill="url(#bg-grad)" />
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.3" />

  <!-- 6M Ascending Pillars (Mapping -> Moving Up) -->
  <rect x="44" y="166" width="18" height="42" rx="6" fill="#10b981" fill-opacity="0.35" />
  <rect x="72" y="146" width="18" height="62" rx="6" fill="#10b981" fill-opacity="0.5" />
  <rect x="100" y="124" width="18" height="84" rx="6" fill="#10b981" fill-opacity="0.65" />
  <rect x="128" y="102" width="18" height="106" rx="6" fill="#10b981" fill-opacity="0.8" />
  <rect x="156" y="80" width="18" height="128" rx="6" fill="#34d399" />

  <!-- Dynamic Upward Mobility Arc & Arrow -->
  <path d="M42 168 C 80 155, 120 115, 186 56" fill="none" stroke="url(#gold-grad)" stroke-width="14" stroke-linecap="round" />
  <path d="M148 52 L 192 52 L 192 96" fill="none" stroke="url(#gold-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Zakat Giving Star / Coin at the Pinnacle -->
  <circle cx="204" cy="40" r="14" fill="url(#gold-grad)" />
  <circle cx="204" cy="40" r="8" fill="#fef08a" />
</svg>
